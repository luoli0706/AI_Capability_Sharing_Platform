services:
  mysql:
    image: mysql:8.0
    container_name: ascp-mysql
    profiles: ["bundled-mysql"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ascp123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ascp}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../src/backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_reservation: ${MYSQL_MEM_RESERVATION:-640m}
    mem_limit: ${MYSQL_MEM_LIMIT:-720m}
    cpus: ${MYSQL_CPUS:-1.0}
    oom_score_adj: -300
    networks:
      - ascp-net

  backend:
    image: ascp-backend:local
    build:
      context: ../src/backend
      dockerfile: ../../docker/backend.Dockerfile
    container_name: ascp-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ascp123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ascp}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-ascp-jwt-secret}
      SEVENO_BIN_PATH: /app/releases/seventhcv-7o-linux
      SEVENO_RELEASE_DIR: /app/releases
    volumes:
      - backend_uploads:/app/uploads
      - ../releases:/app/releases:ro
    mem_reservation: ${BACKEND_MEM_RESERVATION:-720m}
    mem_limit: ${BACKEND_MEM_LIMIT:-810m}
    cpus: ${BACKEND_CPUS:-1.0}
    oom_score_adj: 100
    networks:
      - ascp-net

  frontend:
    image: ascp-frontend:local
    build:
      context: ../src/frontend
      dockerfile: ../../docker/frontend.Dockerfile
    container_name: ascp-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "6657:80"
    volumes:
      - ../src/nginx/ASCP_nginx.prod.conf.example:/etc/nginx/conf.d/default.conf:ro
    mem_reservation: ${FRONTEND_MEM_RESERVATION:-240m}
    mem_limit: ${FRONTEND_MEM_LIMIT:-270m}
    cpus: ${FRONTEND_CPUS:-0.5}
    oom_score_adj: 200
    networks:
      - ascp-net

volumes:
  mysql_data:
  backend_uploads:

networks:
  ascp-net:
    driver: bridge
