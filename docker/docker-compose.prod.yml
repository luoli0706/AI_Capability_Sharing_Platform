services:
  mysql:
    image: mysql:8.0
    container_name: ascp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ascp123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ascp}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../src/backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ascp-net

  backend:
    build:
      context: ../src/backend
      dockerfile: ../../docker/backend.Dockerfile
    container_name: ascp-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ascp123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ascp}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-ascp-jwt-secret}
      SEVENO_BIN_PATH: /app/releases/seventhcv-7o-linux
      SEVENO_RELEASE_DIR: /app/releases
    volumes:
      - backend_uploads:/app/uploads
      - ../releases:/app/releases:ro
    networks:
      - ascp-net

  frontend:
    build:
      context: ../src/frontend
      dockerfile: ../../docker/frontend.Dockerfile
    container_name: ascp-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "6657:80"
    volumes:
      - ../src/nginx/ASCP_nginx.prod.conf.example:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ascp-net

volumes:
  mysql_data:
  backend_uploads:

networks:
  ascp-net:
    driver: bridge
