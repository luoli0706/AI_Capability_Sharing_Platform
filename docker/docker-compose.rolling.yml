services:
  backend:
    image: ascp-backend:local
    build:
      context: ../src/backend
      dockerfile: ../../docker/backend.Dockerfile
    container_name: ascp-backend-${ASCP_SLOT:-blue}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ascp123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ascp}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-ascp-jwt-secret}
      SERVER_MODE: ${SERVER_MODE:-release}
      STORAGE_SECRET: ${STORAGE_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      Aliyun_User_AK: ${Aliyun_User_AK:-}
      Aliyun_User_SK: ${Aliyun_User_SK:-}
      OSS_AK: ${OSS_AK:-}
      OSS_SK: ${OSS_SK:-}
      OSS_BUCKET: ${OSS_BUCKET:-ascp-7thcv-sh}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-shanghai-internal.aliyuncs.com}
      OSS_LOCAL_RETENTION_HOURS: ${OSS_LOCAL_RETENTION_HOURS:-48}
      OSS_LOCAL_MAX_MB: ${OSS_LOCAL_MAX_MB:-8192}
      SEVENO_BIN_PATH: /app/releases/seventhcv-7o-linux
      SEVENO_RELEASE_DIR: /app/releases
    volumes:
      - backend_uploads:/app/uploads
      - ../releases:/app/releases:ro
    mem_reservation: ${ROLLING_BACKEND_MEM_RESERVATION:-256m}
    mem_limit: ${ROLLING_BACKEND_MEM_LIMIT:-384m}
    cpus: ${ROLLING_BACKEND_CPUS:-0.8}
    oom_score_adj: 100
    networks:
      - ascp-net

  frontend:
    image: ascp-frontend:local
    build:
      context: ../src/frontend
      dockerfile: ../../docker/frontend.Dockerfile
    container_name: ascp-nginx-${ASCP_SLOT:-blue}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${ASCP_PORT:-16657}:80"
    volumes:
      - ../src/nginx/ASCP_nginx.prod.conf.example:/etc/nginx/conf.d/default.conf:ro
    mem_reservation: ${ROLLING_FRONTEND_MEM_RESERVATION:-48m}
    mem_limit: ${ROLLING_FRONTEND_MEM_LIMIT:-96m}
    cpus: ${ROLLING_FRONTEND_CPUS:-0.4}
    oom_score_adj: 200
    networks:
      - ascp-net

volumes:
  backend_uploads:
    external: true
    name: docker_backend_uploads

networks:
  ascp-net:
    driver: bridge
